# ─── Default (local) environment ────────────────────────────────────────────
# This block is ONLY for local development (`wrangler dev`). Real deploys
# MUST use `--env staging` or `--env production`. The worker name below is
# deliberately `-local` so that a stray `wrangler deploy` with no `--env`
# flag publishes to a harmless `libedge-api-local` worker instead of
# overwriting production. R2 points at the staging bucket for the same
# reason — never the production bucket by default.
name = "libedge-api-local"
main = "backend/src/worker.js"
compatibility_date = "2026-03-01"
# compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
WORKER_NAME = "libedge-api-local"
RESEARCH_SEMANTIC_PRIMARY_ENABLED = "false"
RESEARCH_SEMANTIC_CANDIDATE_DEPTH = "50"

# D1 Binding (default env) — shares the staging database for `wrangler dev`.
[[d1_databases]]
binding = "DB"
database_name = "libedge-db"
database_id = "207d80d6-7e6b-4e10-aacf-b218970dbaf8"
migrations_dir = "migrations"

# R2 Binding (default env) — staging bucket, NOT the production bucket.
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "libedge-files-staging"

# KV Binding (default env)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "36237237597442bbb7c00ab9b6ee821f"

# Durable Object used only as a global semantic request-start pacing gate.
[[durable_objects.bindings]]
name = "OPENALEX_SEMANTIC_PACER"
class_name = "OpenAlexSemanticPacer"

# New Durable Object namespaces use SQLite-backed storage.
[exports.OpenAlexSemanticPacer]
type = "durable-object"
storage = "sqlite"

# JWT_SECRET: npx wrangler secret put JWT_SECRET
# R2_PUBLIC_URL: npx wrangler secret put R2_PUBLIC_URL
# AIRTABLE_PAT: npx wrangler secret put AIRTABLE_PAT
# AIRTABLE_BASE_ID: npx wrangler secret put AIRTABLE_BASE_ID
# RESEND_API_KEY:   npx wrangler secret put RESEND_API_KEY   [--env staging|production]
# RESEND_ALERT_TO:  npx wrangler secret put RESEND_ALERT_TO  [--env staging|production]

# Staging environment
[env.staging]
name = "libedge-api-staging"
workers_dev = true

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
WORKER_NAME = "libedge-api-staging"
RESEARCH_SEMANTIC_PRIMARY_ENABLED = "false"
RESEARCH_SEMANTIC_CANDIDATE_DEPTH = "50"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "libedge-db"
database_id = "207d80d6-7e6b-4e10-aacf-b218970dbaf8"

[[env.staging.r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "libedge-files-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "556d17f88a7a48e381e5ffed1d150536"

[[env.staging.durable_objects.bindings]]
name = "OPENALEX_SEMANTIC_PACER"
class_name = "OpenAlexSemanticPacer"

# Production environment
[env.production]
name = "libedge-api-prod"

[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
WORKER_NAME = "libedge-api-prod"
RESEARCH_SEMANTIC_PRIMARY_ENABLED = "false"
RESEARCH_SEMANTIC_CANDIDATE_DEPTH = "50"

# Production deploys fail closed when core application secrets are missing.
# Secret values remain encrypted in Cloudflare and are never stored here.
[env.production.secrets]
required = ["JWT_SECRET", "RESEND_API_KEY", "AIRTABLE_PAT", "AIRTABLE_BASE_ID"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "libedge-db-production"
database_id = "64e57edf-8163-4495-8874-fec00485b2ff"

[[env.production.r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "libedge-files"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "5640d9b898c54a96bdd9e361e1c6f593"

[[env.production.durable_objects.bindings]]
name = "OPENALEX_SEMANTIC_PACER"
class_name = "OpenAlexSemanticPacer"
