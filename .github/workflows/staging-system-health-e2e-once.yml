name: Staging System Health E2E Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-system-health-e2e-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify anonymous endpoint protection
        run: |
          code="$(curl -sS -o /tmp/health-anon.json -w '%{http_code}' https://staging.libedge-website.pages.dev/api/admin/system-health)"
          test "$code" = "401"
          jq -e '.error | type == "string"' /tmp/health-anon.json >/dev/null

      - name: Login smoke admin and inspect role
        env:
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$LIBEDGE_SMOKE_ADMIN_EMAIL"
          test -n "$LIBEDGE_SMOKE_ADMIN_PASSWORD"
          curl -sS -c /tmp/libedge-cookies.txt \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg email "$LIBEDGE_SMOKE_ADMIN_EMAIL" --arg password "$LIBEDGE_SMOKE_ADMIN_PASSWORD" '{email:$email,password:$password}')" \
            https://staging.libedge-website.pages.dev/api/auth/login \
            -o /tmp/login.json
          curl -sS -b /tmp/libedge-cookies.txt \
            https://staging.libedge-website.pages.dev/api/user/profile \
            -o /tmp/profile.json
          role="$(jq -r '.role // .user.role // empty' /tmp/profile.json)"
          echo "Smoke admin role: ${role:-unknown}"
          test "$role" = "super_admin"

      - name: Verify live super-admin health summary
        run: |
          code="$(curl -sS -b /tmp/libedge-cookies.txt -o /tmp/health.json -w '%{http_code}' https://staging.libedge-website.pages.dev/api/admin/system-health)"
          test "$code" = "200"
          jq -e '
            (.status == "healthy" or .status == "degraded") and
            .checked_at and
            .environment == "staging" and
            .worker_name == "libedge-api-staging" and
            (.components.database.status == "ok" or .components.database.status == "error") and
            (.components.object_storage.status == "ok" or .components.object_storage.status == "error") and
            (.components.rate_limit_store.status == "ok" or .components.rate_limit_store.status == "error") and
            (.privacy.pending_r2_purge | type == "number") and
            (.activity.actions_24h | type == "number")
          ' /tmp/health.json >/dev/null
          if grep -Eqi 'jwt|secret|token|password|bucket unavailable|stack|sql error' /tmp/health.json; then
            echo 'Unexpected sensitive/internal detail in health response'
            exit 1
          fi

      - name: Check whether Pages frontend is already live
        run: |
          curl -fsS https://staging.libedge-website.pages.dev/admin.html -o /tmp/admin-live.html
          if grep -q 'id="systemHealthCard"' /tmp/admin-live.html && grep -q 'assets/js/admin-health.js?v=20260907a' /tmp/admin-live.html; then
            echo 'SYSTEM_HEALTH_FRONTEND_LIVE=true'
          else
            echo 'SYSTEM_HEALTH_FRONTEND_LIVE=false'
            exit 2
          fi
