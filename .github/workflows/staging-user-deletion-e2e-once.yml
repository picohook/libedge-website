name: Staging User Deletion E2E Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-user-deletion-e2e-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Seed disposable privacy fixture
        run: |
          set -euo pipefail
          EMAIL="kvkk-e2e-${GITHUB_RUN_ID}@example.invalid"
          OUT="$(npx wrangler d1 execute libedge-db --remote --env staging --json --command "INSERT INTO users (email,password_hash,role) VALUES ('$EMAIL','e2e-not-a-real-password','user'); SELECT id FROM users WHERE email='$EMAIL';")"
          ID="$(node -e 'const x=JSON.parse(process.argv[1]); const rows=x.flatMap(v=>v.results||[]); const r=rows.find(v=>v.id!=null); if(!r) process.exit(1); process.stdout.write(String(r.id))' "$OUT")"
          echo "TEST_ID=$ID" >> "$GITHUB_ENV"
          echo "TEST_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          npx wrangler d1 execute libedge-db --remote --env staging --command "INSERT INTO subscriptions (user_id,product_slug,status) VALUES ($ID,'kvkk-e2e','trial'); INSERT INTO form_submissions (form_type,name,email,user_id,subject,message,admin_note) VALUES ('contact','Privacy Test','$EMAIL',$ID,'private subject','private message','private admin note');"
      - name: Delete disposable user and invoke privacy trigger
        run: npx wrangler d1 execute libedge-db --remote --env staging --command "DELETE FROM users WHERE id = $TEST_ID;"
      - name: Verify deletion and privacy cleanup
        run: |
          set -euo pipefail
          OUT="$(npx wrangler d1 execute libedge-db --remote --env staging --json --command "SELECT (SELECT COUNT(*) FROM users WHERE id=$TEST_ID) AS users_left, (SELECT COUNT(*) FROM subscriptions WHERE user_id=$TEST_ID) AS subscriptions_left, (SELECT COUNT(*) FROM form_submissions WHERE user_id IS NULL AND email IS NULL AND name IS NULL AND subject IS NULL AND message IS NULL AND admin_note IS NULL AND form_type='contact') AS scrubbed_forms;")"
          printf '%s\n' "$OUT"
          node -e 'const x=JSON.parse(process.argv[1]); const r=x[0]?.results?.[0]; if(!r||Number(r.users_left)!==0||Number(r.subscriptions_left)!==0||Number(r.scrubbed_forms)<1){console.error("Privacy verification failed",r);process.exit(1)}' "$OUT"
      - name: Clean disposable retained rows
        if: always()
        run: |
          if [ -n "${TEST_ID:-}" ]; then
            npx wrangler d1 execute libedge-db --remote --env staging --command "DELETE FROM form_submissions WHERE user_id=$TEST_ID OR (user_id IS NULL AND email='$TEST_EMAIL'); DELETE FROM subscriptions WHERE user_id=$TEST_ID; DELETE FROM users WHERE id=$TEST_ID;" || true
          fi
