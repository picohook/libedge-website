name: Apply staging telemetry migration once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/apply-staging-telemetry-migration-once.yml'

concurrency:
  group: apply-staging-telemetry-migration-once
  cancel-in-progress: false

jobs:
  apply-staging:
    name: Apply staging D1 migration
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: List pending staging migrations
        run: npx wrangler d1 migrations list libedge-db --remote --env staging

      - name: Apply staging migrations
        run: npx wrangler d1 migrations apply libedge-db --remote --env staging

      - name: Verify telemetry counter table
        run: >-
          npx wrangler d1 execute libedge-db --remote --env staging
          --command "SELECT name FROM sqlite_master WHERE type='table' AND name='research_telemetry_counters';"
