name: P05 Production D1 Read-Only Inspection

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/p05-production-d1-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-production-d1:
    name: Inspect production D1 migration state (read-only)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Show intended production binding from wrangler.toml
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.toml', 'utf8');
          const marker = '[[env.production.d1_databases]]';
          const start = text.indexOf(marker);
          if (start < 0) throw new Error('production D1 binding not found');
          const tail = text.slice(start);
          const next = tail.indexOf('\n[[' , marker.length);
          console.log(next > 0 ? tail.slice(0, next) : tail);
          NODE
      - name: List pending production D1 migrations only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list DB --env production --remote
