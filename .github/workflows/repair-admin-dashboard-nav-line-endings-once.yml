name: Repair Admin Dashboard KPI Patch Line Endings Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/repair-admin-dashboard-nav-line-endings-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 5

      - name: Restore pre-patch admin bytes and insert one script line
        run: |
          git show 585afc09c8e10a425583285b999a199e5fc1c881:admin.html > admin.html
          python - <<'PY'
          from pathlib import Path
          path = Path('admin.html')
          data = path.read_bytes()
          marker_crlf = b'<script src="assets/js/admin-health.js?v=20260907a"></script>\r\n'
          marker_lf = b'<script src="assets/js/admin-health.js?v=20260907a"></script>\n'
          if data.count(marker_crlf) == 1:
              marker = marker_crlf
              newline = b'\r\n'
          elif data.count(marker_lf) == 1:
              marker = marker_lf
              newline = b'\n'
          else:
              raise SystemExit('expected exactly one admin-health script marker')
          insert = marker + b'<script src="assets/js/admin-dashboard-nav.js?v=20260907a"></script>' + newline
          data = data.replace(marker, insert, 1)
          path.write_bytes(data)
          PY

      - name: Validate repaired content
        run: |
          grep -q 'assets/js/admin-dashboard-nav.js?v=20260907a' admin.html
          test "$(grep -o 'assets/js/admin-dashboard-nav.js?v=20260907a' admin.html | wc -l)" -eq 1

      - name: Commit repaired patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Preserve admin line endings for KPI navigation'
          git push origin staging
