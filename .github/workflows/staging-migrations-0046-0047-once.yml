name: Staging Migrations 0046-0047 Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-migrations-0046-0047-once.yml'

permissions:
  contents: read

jobs:
  migrate:
    name: Guard and apply migrations 0046-0047
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify exact pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 migrations list libedge-db --remote --env staging 2>&1)"
          printf '%s\n' "$output"
          pending="$(printf '%s\n' "$output" | grep -Eo '[0-9]{4}[A-Za-z0-9_-]*\.sql' | sort -u || true)"
          expected="$(printf '%s\n' '0046_add_ai_product_cards.sql' '0047_user_deletion_integrity.sql' | sort -u)"
          if [ "$pending" != "$expected" ]; then
            echo 'Refusing to apply: pending migrations are not exactly 0046 and 0047.' >&2
            printf 'Pending:\n%s\n' "$pending" >&2
            exit 1
          fi
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply libedge-db --remote --env staging
      - name: Verify no pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 migrations list libedge-db --remote --env staging 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '0046_add_ai_product_cards\.sql|0047_user_deletion_integrity\.sql'; then
            echo 'Migration verification failed.' >&2
            exit 1
          fi
