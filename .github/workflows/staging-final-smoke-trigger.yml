name: Staging Final Smoke Trigger

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  final-smoke:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run auth smoke
        env:
          LIBEDGE_SMOKE_BASE_URL: https://staging.libedge-website.pages.dev
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
        run: npm run smoke:auth
      - name: Run file smoke
        env:
          LIBEDGE_SMOKE_BASE_URL: https://staging.libedge-website.pages.dev
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
          LIBEDGE_SMOKE_OTHER_EMAIL: ${{ secrets.LIBEDGE_SMOKE_OTHER_EMAIL }}
          LIBEDGE_SMOKE_OTHER_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_OTHER_PASSWORD }}
        run: npm run smoke:files
      - name: Run frontend smoke
        env:
          LIBEDGE_FRONTEND_SMOKE_LIVE_URL: https://staging.libedge-website.pages.dev
        run: npm run smoke:frontend
      - name: Live staging basic check
        run: |
          curl --fail --silent --show-error --retry 3 https://staging.libedge-website.pages.dev/ > /dev/null
          curl --fail --silent --show-error --retry 3 https://staging.libedge-website.pages.dev/profile.html > /dev/null
          curl --fail --silent --show-error --retry 3 https://staging.libedge-website.pages.dev/admin.html > /dev/null
