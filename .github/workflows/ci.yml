name: CI

on:
  workflow_dispatch:
  # Run CI for every PR base, including temporary stacked feature branches.
  # Push/deploy behavior remains restricted below to staging/main.
  pull_request:
  push:
    branches:
      - staging
      - main

jobs:
  test:
    name: Lint + tests + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm version
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        # Repo does not commit package-lock.json (see .gitignore), so use
        # 'npm install' instead of 'npm ci'.
        run: npm install --no-audit --no-fund

      - name: Syntax check (backend worker)
        run: node --check backend/src/index.js

      - name: Syntax check (scripts)
        run: |
          for f in scripts/*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Lint (ESLint, bug-only rules)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate staging Wrangler config (dry-run only)
        run: npx wrangler deploy --dry-run --env staging --outdir /tmp/wrangler-dry-run

      - name: Build CSS
        run: npm run build

      - name: Assert representative generated Tailwind utilities
        run: |
          grep -Fq '.xl\\:grid-cols-3' assets/css/tailwind.css || { echo 'missing generated utility: xl:grid-cols-3'; exit 1; }
          grep -Fq '.gap-6' assets/css/tailwind.css || { echo 'missing generated utility: gap-6'; exit 1; }


  frontend-browser:
    name: Playwright browser regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm version
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: npx playwright test --project=chromium


  assistant-integration:
    name: Assistant orchestration + real Discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm version
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run real OpenAlex orchestration integration
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: npm run test:assistant-integration

  assistant-staging-smoke:
    name: Assistant staging fail-closed smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run authenticated Assistant staging smoke
        env:
          LIBEDGE_SMOKE_BASE_URL: https://staging.libedge-website.pages.dev
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_ASSISTANT_SMOKE_EXPECTED_CODE: RESEARCH_ENTITLEMENT_REQUIRED
          LIBEDGE_ASSISTANT_SMOKE_EXPECTED_STATUS: '403'
        run: |
          if [ -z "$LIBEDGE_SMOKE_EMAIL" ] || [ -z "$LIBEDGE_SMOKE_PASSWORD" ]; then
            echo "::notice::Assistant staging smoke skipped because LIBEDGE_SMOKE_EMAIL/LIBEDGE_SMOKE_PASSWORD are not configured."
            exit 0
          fi
          npm run smoke:assistant


  support-checker-contract:
    name: Fresh-Checker contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Fresh-Checker dependencies
        working-directory: support-checker
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run network-free Fresh-Checker contract tests
        working-directory: support-checker
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -v
