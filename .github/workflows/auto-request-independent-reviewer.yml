name: Auto-request independent reviewer

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request independent reviewer for current PR head
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const reviewer = 'libedge-ai-reviewer';

            const { data: requested } = await github.rest.pulls.listRequestedReviewers({
              owner,
              repo,
              pull_number
            });

            const alreadyRequested = requested.users.some(
              (user) => user.login === reviewer
            );

            if (!alreadyRequested) {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: [reviewer]
              });
            }

            core.info(
              `Independent reviewer ${reviewer} requested for PR #${pull_number} at head ${context.payload.pull_request.head.sha}`
            );
