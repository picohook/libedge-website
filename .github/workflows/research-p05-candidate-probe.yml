name: P0.5 Candidate Recall Probe

on:
  push:
    branches: [staging]
    paths:
      - 'scripts/research-p05-candidate-probe.mjs'
      - '.github/workflows/research-p05-candidate-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe OpenAlex top-100 candidate pools
        run: node scripts/research-p05-candidate-probe.mjs
