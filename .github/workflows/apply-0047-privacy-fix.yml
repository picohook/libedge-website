name: Apply 0047 admin-delete audit ordering fix

on:
  push:
    branches:
      - fix/0047-admin-delete-audit-order
    paths:
      - .github/workflows/apply-0047-privacy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0047-admin-delete-audit-order
          fetch-depth: 0

      - name: Reorder admin deletion audit statement
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/src/index.js')
          source = path.read_text(encoding='utf-8')

          old = """  const actor = await getTokenPayloadFromCookie(c);\n  await db.batch([\n    db.prepare(`DELETE FROM newsletter_subscriptions WHERE user_id = ?`).bind(id),\n    db.prepare(`DELETE FROM subscriptions WHERE user_id=?`).bind(id),\n    db.prepare(`DELETE FROM users WHERE id=?`).bind(id),\n    createAdminActionLogStmt(db, {\n      id: crypto.randomUUID(),\n      actor,\n      entityType: 'user',\n      entityId: id,\n      action: 'delete',\n      before: sanitizeUserForAudit(userRow),\n    }),\n  ]);\n"""

          new = """  const actor = await getTokenPayloadFromCookie(c);\n  await db.batch([\n    // Write the deletion audit row before deleting the user so the 0047\n    // BEFORE DELETE trigger can redact its user snapshot in the same transaction.\n    createAdminActionLogStmt(db, {\n      id: crypto.randomUUID(),\n      actor,\n      entityType: 'user',\n      entityId: id,\n      action: 'delete',\n      before: sanitizeUserForAudit(userRow),\n    }),\n    db.prepare(`DELETE FROM newsletter_subscriptions WHERE user_id = ?`).bind(id),\n    db.prepare(`DELETE FROM subscriptions WHERE user_id=?`).bind(id),\n    db.prepare(`DELETE FROM users WHERE id=?`).bind(id),\n  ]);\n"""

          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one admin-delete block, found {source.count(old)}')

          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Remove one-time workflow and commit patch
        run: |
          rm .github/workflows/apply-0047-privacy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/index.js .github/workflows/apply-0047-privacy-fix.yml
          git commit -m "fix: redact admin deletion audit snapshot via trigger ordering"
          git push origin HEAD:fix/0047-admin-delete-audit-order
