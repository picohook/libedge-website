name: Cleanup Legacy 0047 Synthetic Fixtures
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose INVENTORY for read-only inspection or CLEANUP for deletion
        required: true
        type: choice
        options:
          - INVENTORY
          - CLEANUP
      confirmation:
        description: For CLEANUP only, type exactly CLEANUP-LEGACY-0047-STAGING
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cleanup-legacy-0047-staging
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: staging }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - name: Enforce cleanup authorization when destructive mode is selected
        if: ${{ inputs.mode == 'CLEANUP' }}
        run: |
          test "${{ inputs.confirmation }}" = "CLEANUP-LEGACY-0047-STAGING" || {
            echo "::error::CLEANUP mode requires exact destructive confirmation"; exit 1;
          }
      - name: Read-only inventory
        run: |
          cat > "$RUNNER_TEMP/inventory.sql" <<'SQL'
          SELECT 'users' resource,COUNT(*) n FROM users WHERE email LIKE '0047-test-%@example.invalid';
          SELECT 'institutions' resource,COUNT(*) n FROM institutions WHERE name LIKE '0047-test-%-institution';
          SELECT 'announcements' resource,COUNT(*) n FROM announcements WHERE title LIKE '0047-test-%';
          SELECT 'support_tickets' resource,COUNT(*) n FROM support_tickets WHERE subject LIKE '0047-test-%';
          SELECT 'product_requests' resource,COUNT(*) n FROM product_requests WHERE product_slug LIKE '0047-test-%' OR reason LIKE '0047-test-%';
          SELECT 'form_submissions' resource,COUNT(*) n FROM form_submissions WHERE email LIKE '0047-test-%@example.invalid' OR product LIKE '0047-test-%' OR message LIKE '0047-test-%';
          SELECT 'affiliate_clicks' resource,COUNT(*) n FROM affiliate_clicks WHERE source LIKE '0047-test-%' OR referer LIKE '%0047-test-%';
          SELECT 'ra_link_audit_findings' resource,COUNT(*) n FROM ra_link_audit_findings WHERE key_hash LIKE '0047-test-%' OR session_id LIKE '0047-test-%';
          SELECT 'institution_folders' resource,COUNT(*) n FROM institution_folders WHERE folder_name LIKE '0047-test-%';
          SELECT 'institution_files' resource,COUNT(*) n FROM institution_files WHERE file_name LIKE '0047-test-%' OR file_url LIKE '%0047-test-%';
          SELECT 'institution_subscriptions' resource,COUNT(*) n FROM institution_subscriptions WHERE product_slug LIKE '0047-test-%';
          SELECT 'admin_action_logs' resource,COUNT(*) n FROM admin_action_logs WHERE id LIKE '0047-test-%' OR before_json LIKE '%0047-test-%' OR after_json LIKE '%0047-test-%';
          SELECT 'privacy_r2_purge_queue' resource,COUNT(*) n FROM privacy_r2_purge_queue WHERE object_url LIKE '%0047-test-%';
          SQL
          npx wrangler d1 execute libedge-db --env staging --remote --file "$RUNNER_TEMP/inventory.sql"
      - name: Stop after read-only inventory
        if: ${{ inputs.mode == 'INVENTORY' }}
        run: echo "INVENTORY_ONLY_COMPLETE"

      - name: Marker-scoped cleanup
        if: ${{ inputs.mode == 'CLEANUP' }}
        run: |
          cat > "$RUNNER_TEMP/cleanup.sql" <<'SQL'
          DELETE FROM announcement_reactions WHERE announcement_id IN (SELECT id FROM announcements WHERE title LIKE '0047-test-%');
          DELETE FROM announcement_comments WHERE announcement_id IN (SELECT id FROM announcements WHERE title LIKE '0047-test-%') OR body LIKE '0047-test-%';
          DELETE FROM announcements WHERE title LIKE '0047-test-%';
          DELETE FROM ticket_replies WHERE ticket_id IN (SELECT id FROM support_tickets WHERE subject LIKE '0047-test-%') OR message LIKE '0047-test-%';
          DELETE FROM support_tickets WHERE subject LIKE '0047-test-%';
          DELETE FROM product_requests WHERE product_slug LIKE '0047-test-%' OR reason LIKE '0047-test-%' OR use_case LIKE '0047-test-%';
          DELETE FROM form_submissions WHERE email LIKE '0047-test-%@example.invalid' OR product LIKE '0047-test-%' OR message LIKE '0047-test-%' OR institution LIKE '0047-test-%';
          DELETE FROM affiliate_clicks WHERE source LIKE '0047-test-%' OR referer LIKE '%0047-test-%' OR user_agent LIKE '0047-test-%';
          DELETE FROM ra_link_audit_findings WHERE key_hash LIKE '0047-test-%' OR session_id LIKE '0047-test-%' OR reason LIKE '0047-test-%' OR sample_text LIKE '0047-test-%';
          DELETE FROM institution_files WHERE file_name LIKE '0047-test-%' OR file_url LIKE '%0047-test-%';
          DELETE FROM institution_folders WHERE folder_name LIKE '0047-test-%';
          DELETE FROM institution_subscriptions WHERE product_slug LIKE '0047-test-%';
          DELETE FROM admin_action_logs WHERE id LIKE '0047-test-%' OR entity_id LIKE '0047-test-%' OR before_json LIKE '%0047-test-%' OR after_json LIKE '%0047-test-%';
          DELETE FROM users WHERE email LIKE '0047-test-%@example.invalid';
          DELETE FROM notifications WHERE type='0047-test' OR title LIKE '0047-test-%' OR content LIKE '0047-test-%';
          DELETE FROM user_notifications WHERE ref_type='0047-test' OR title LIKE '0047-test-%' OR body LIKE '0047-test-%';
          DELETE FROM share_recipients WHERE share_id IN (SELECT id FROM file_shares WHERE message LIKE '0047-test-%');
          DELETE FROM file_shares WHERE message LIKE '0047-test-%';
          DELETE FROM user_collection_files WHERE display_name LIKE '0047-test-%';
          DELETE FROM collection_files WHERE display_name LIKE '0047-test-%';
          DELETE FROM user_collections WHERE name LIKE '0047-test-%';
          DELETE FROM collections WHERE name LIKE '0047-test-%';
          DELETE FROM files WHERE hash LIKE '0047-test-%' OR file_key LIKE 'synthetic/0047-test-%' OR original_name LIKE '0047-test-%';
          DELETE FROM privacy_r2_purge_queue WHERE object_url LIKE '%0047-test-%';
          DELETE FROM institutions WHERE name LIKE '0047-test-%-institution';
          SQL
          npx wrangler d1 execute libedge-db --env staging --remote --file "$RUNNER_TEMP/cleanup.sql"
      - name: Verify zero marker-scoped leftovers
        if: ${{ inputs.mode == 'CLEANUP' }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const checks = [
            ["users", "SELECT COUNT(*) n FROM users WHERE email LIKE '0047-test-%@example.invalid'"],
            ["institutions", "SELECT COUNT(*) n FROM institutions WHERE name LIKE '0047-test-%-institution'"],
            ["announcements", "SELECT COUNT(*) n FROM announcements WHERE title LIKE '0047-test-%'"],
            ["support_tickets", "SELECT COUNT(*) n FROM support_tickets WHERE subject LIKE '0047-test-%'"],
            ["product_requests", "SELECT COUNT(*) n FROM product_requests WHERE product_slug LIKE '0047-test-%' OR reason LIKE '0047-test-%'"],
            ["form_submissions", "SELECT COUNT(*) n FROM form_submissions WHERE email LIKE '0047-test-%@example.invalid' OR product LIKE '0047-test-%' OR message LIKE '0047-test-%'"],
            ["affiliate_clicks", "SELECT COUNT(*) n FROM affiliate_clicks WHERE source LIKE '0047-test-%' OR referer LIKE '%0047-test-%'"],
            ["ra_link_audit_findings", "SELECT COUNT(*) n FROM ra_link_audit_findings WHERE key_hash LIKE '0047-test-%' OR session_id LIKE '0047-test-%'"],
            ["institution_folders", "SELECT COUNT(*) n FROM institution_folders WHERE folder_name LIKE '0047-test-%'"],
            ["institution_files", "SELECT COUNT(*) n FROM institution_files WHERE file_name LIKE '0047-test-%' OR file_url LIKE '%0047-test-%'"],
            ["institution_subscriptions", "SELECT COUNT(*) n FROM institution_subscriptions WHERE product_slug LIKE '0047-test-%'"],
            ["admin_action_logs", "SELECT COUNT(*) n FROM admin_action_logs WHERE id LIKE '0047-test-%' OR before_json LIKE '%0047-test-%' OR after_json LIKE '%0047-test-%'"],
            ["privacy_r2_purge_queue", "SELECT COUNT(*) n FROM privacy_r2_purge_queue WHERE object_url LIKE '%0047-test-%'"]
          ];
          const leftovers = [];
          for (const [resource, sql] of checks) {
            const out = execFileSync('npx',['wrangler','d1','execute','libedge-db','--env','staging','--remote','--command',sql,'--json'],{encoding:'utf8',env:process.env});
            const payload=JSON.parse(out); const result=Array.isArray(payload)?payload[0]:payload;
            if (!result?.success) throw new Error(out);
            const n=Number(result.results?.[0]?.n ?? NaN);
            console.log({resource,n});
            if (!Number.isFinite(n) || n !== 0) leftovers.push({resource,n});
          }
          if (leftovers.length) throw new Error('0047 marker-scoped leftovers remain: '+JSON.stringify(leftovers));
          console.log('LEGACY_0047_CLEANUP_VERIFIED');
          NODE
