name: Research Live Validation Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/research-live-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run live research smoke
        env:
          LIBEDGE_SMOKE_BASE_URL: 'https://staging.libedge-website.pages.dev'
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_RESEARCH_SMOKE_QUERY: 'CRISPR base editing sickle cell'
        run: npm run smoke:research
