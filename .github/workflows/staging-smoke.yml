name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Staging base URL'
        required: true
        type: string
        default: 'https://staging.libedge-website.pages.dev'
      source_ref:
        description: 'Git ref to test'
        required: true
        type: string
        default: 'staging'
      run_auth:
        description: 'Run auth smoke'
        required: true
        type: boolean
        default: true
      run_files:
        description: 'Run file smoke'
        required: true
        type: boolean
        default: true
      run_research:
        description: 'Run research metadata smoke'
        required: true
        type: boolean
        default: true
      run_assistant:
        description: 'Run assistant provider-gate smoke'
        required: true
        type: boolean
        default: true
      run_frontend:
        description: 'Run frontend browser smoke'
        required: true
        type: boolean
        default: true
      run_sparse_benchmark:
        description: 'Measure Research v2 sparse benchmark candidates through Assistant'
        required: true
        type: boolean
        default: false
      run_retrieval_benchmark:
        description: 'Run controlled lexical-10 / lexical-50 / semantic-50 Research benchmark'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Live staging smoke
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm version
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for frontend smoke
        if: inputs.run_frontend
        run: npx playwright install --with-deps chromium

      - name: Verify smoke credentials
        env:
          RUN_AUTH: ${{ inputs.run_auth }}
          RUN_FILES: ${{ inputs.run_files }}
          RUN_RESEARCH: ${{ inputs.run_research }}
          RUN_ASSISTANT: ${{ inputs.run_assistant }}
          RUN_SPARSE_BENCHMARK: ${{ inputs.run_sparse_benchmark }}
          RUN_RETRIEVAL_BENCHMARK: ${{ inputs.run_retrieval_benchmark }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
        run: |
          missing=0

          require_secret() {
            if [ -z "${!1}" ]; then
              echo "::error title=Missing secret::$1 is required for staging smoke"
              missing=1
            fi
          }

          if [ "$RUN_AUTH" = "true" ] || [ "$RUN_FILES" = "true" ] || [ "$RUN_RESEARCH" = "true" ] || [ "$RUN_ASSISTANT" = "true" ] || [ "$RUN_SPARSE_BENCHMARK" = "true" ] || [ "$RUN_RETRIEVAL_BENCHMARK" = "true" ]; then
            require_secret LIBEDGE_SMOKE_EMAIL
            require_secret LIBEDGE_SMOKE_PASSWORD
          fi

          if [ "$RUN_AUTH" = "true" ] || [ "$RUN_FILES" = "true" ] || [ "$RUN_SPARSE_BENCHMARK" = "true" ] || [ "$RUN_RETRIEVAL_BENCHMARK" = "true" ]; then
            require_secret LIBEDGE_SMOKE_ADMIN_EMAIL
            require_secret LIBEDGE_SMOKE_ADMIN_PASSWORD
          fi

          exit "$missing"

      - name: Run auth smoke
        if: inputs.run_auth
        env:
          LIBEDGE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
        run: npm run smoke:auth

      - name: Run file smoke
        if: inputs.run_files
        env:
          LIBEDGE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
          LIBEDGE_SMOKE_OTHER_EMAIL: ${{ secrets.LIBEDGE_SMOKE_OTHER_EMAIL }}
          LIBEDGE_SMOKE_OTHER_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_OTHER_PASSWORD }}
        run: npm run smoke:files

      - name: Run research smoke
        if: inputs.run_research
        env:
          LIBEDGE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
        run: npm run smoke:research

      - name: Run assistant gate smoke
        if: inputs.run_assistant
        env:
          LIBEDGE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
        run: npm run smoke:assistant

      - name: Measure sparse benchmark candidates
        if: inputs.run_sparse_benchmark
        env:
          LIBEDGE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
        run: node scripts/research-sparse-benchmark.mjs

      - name: Grant temporary Research entitlement for retrieval benchmark
        if: inputs.run_retrieval_benchmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const email = String(process.env.LIBEDGE_SMOKE_EMAIL || '').trim().toLowerCase();
          if (!email) throw new Error('LIBEDGE_SMOKE_EMAIL is required');
          const quoted = email.replaceAll("'", "''");
          fs.writeFileSync('/tmp/grant-retrieval-benchmark-entitlement.sql', `
          INSERT INTO subscriptions (user_id, product_slug, status, start_date, end_date)
          SELECT id, 'research', 'active', '2000-01-01 00:00:00', '2099-12-31 23:59:58'
          FROM users
          WHERE lower(email) = '${quoted}'
            AND NOT EXISTS (
              SELECT 1 FROM subscriptions s
              WHERE s.user_id = users.id AND s.product_slug = 'research' AND s.status = 'active'
                AND (s.start_date IS NULL OR date(s.start_date) <= date('now'))
                AND (s.end_date IS NULL OR date(s.end_date) >= date('now'))
            );
          `);
          NODE
          npx --yes wrangler@4.131.1 d1 execute libedge-db --remote --env staging --file /tmp/grant-retrieval-benchmark-entitlement.sql

      - name: Run controlled retrieval benchmark
        if: inputs.run_retrieval_benchmark
        env:
          LIBEDGE_SMOKE_BASE_URL: ${{ inputs.base_url }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_SMOKE_ADMIN_EMAIL: ${{ secrets.LIBEDGE_SMOKE_ADMIN_EMAIL }}
          LIBEDGE_SMOKE_ADMIN_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_ADMIN_PASSWORD }}
        run: node scripts/research-retrieval-benchmark.mjs

      - name: Remove temporary Research entitlement for retrieval benchmark
        if: always() && inputs.run_retrieval_benchmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const email = String(process.env.LIBEDGE_SMOKE_EMAIL || '').trim().toLowerCase();
          if (!email) throw new Error('LIBEDGE_SMOKE_EMAIL is required');
          const quoted = email.replaceAll("'", "''");
          fs.writeFileSync('/tmp/revoke-retrieval-benchmark-entitlement.sql', `
          DELETE FROM subscriptions
          WHERE product_slug = 'research' AND status = 'active'
            AND start_date = '2000-01-01 00:00:00' AND end_date = '2099-12-31 23:59:58'
            AND user_id IN (SELECT id FROM users WHERE lower(email) = '${quoted}');
          `);
          NODE
          npx --yes wrangler@4.131.1 d1 execute libedge-db --remote --env staging --file /tmp/revoke-retrieval-benchmark-entitlement.sql

      - name: Run frontend browser smoke
        if: inputs.run_frontend
        env:
          LIBEDGE_FRONTEND_SMOKE_LIVE_URL: ${{ inputs.base_url }}
        run: npm run smoke:frontend
