name: P0.5 Semantic Gap Probe

on:
  push:
    branches: [staging]
    paths:
      - 'scripts/research-p05-semantic-gap-probe.mjs'
      - '.github/workflows/research-p05-semantic-gap-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare lexical top-100 with semantic top-50
        run: node scripts/research-p05-semantic-gap-probe.mjs
