name: SupportCheck Staging E2E Drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SUPPORTCHECK-STAGING-E2E-DRILL'
        required: true
        type: string
      query:
        description: 'Non-sensitive English research query'
        required: false
        default: 'PEM water electrolysis catalyst'
        type: string

permissions:
  contents: read

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "SUPPORTCHECK-STAGING-E2E-DRILL" || {
            echo "::error::Exact staging drill confirmation required."
            exit 1
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resume supportCheck in staging only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler kv key put --binding RATE_LIMIT_KV --env staging --remote "assistant:supportcheck:paused" "resume"

      - name: Run authorized Research E2E
        env:
          LIBEDGE_SMOKE_BASE_URL: https://staging.libedge-website.pages.dev
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_ASSISTANT_SMOKE_QUERY: ${{ inputs.query }}
        run: node scripts/assistant-success-smoke.mjs

      - name: Pause supportCheck again
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler kv key put --binding RATE_LIMIT_KV --env staging --remote "assistant:supportcheck:paused" "true"
