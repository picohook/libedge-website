name: Apply 0049 to staging once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/apply-0049-staging-once.yml'

permissions:
  contents: read

jobs:
  apply-0049:
    name: Controlled staging 0049 migration apply
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pre-apply guardrails
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          echo '=== TARGET ==='
          echo 'Database binding: libedge-db'
          echo 'Environment: staging'
          echo 'Remote: yes'

          echo '=== MIGRATION BLOB SHA ==='
          actual_blob_sha="$(git hash-object migrations/0049_user_notifications_deletion_policy.sql)"
          echo "actual_blob_sha=${actual_blob_sha}"
          test "${actual_blob_sha}" = 'eba44d7bff0a38d8caaa54ffcd51b7763108ed89'

          echo '=== PENDING MIGRATIONS ==='
          npx wrangler d1 migrations list libedge-db --env staging --remote | tee /tmp/pending.txt
          python - <<'PY'
          import re
          text = open('/tmp/pending.txt', encoding='utf-8').read()
          names = sorted(set(re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b', text)))
          print('parsed_pending=', names)
          expected = ['0049_user_notifications_deletion_policy.sql']
          if names != expected:
              raise SystemExit(f'HARD STOP: expected only {expected}, got {names}')
          PY

          echo '=== LIVE PRE-0049 TRIGGER ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "SELECT sql FROM sqlite_master WHERE type='trigger' AND name='trg_users_privacy_cleanup';" | tee /tmp/pre_trigger.txt

          echo '=== LIVE PRE-0049 user_notifications FK ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA foreign_key_list(user_notifications);" | tee /tmp/pre_fk.txt

          echo '=== LIVE PRE-0049 user_notifications INDEXES ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA index_list(user_notifications);" | tee /tmp/pre_indexes.txt

          echo '=== LIVE PRE-0049 user_notifications TABLE SQL ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='user_notifications';" | tee /tmp/pre_table.txt

          python - <<'PY'
          import json, re

          def extract_json(path):
              text = open(path, encoding='utf-8').read()
              dec = json.JSONDecoder()
              for i, ch in enumerate(text):
                  if ch not in '[{':
                      continue
                  try:
                      obj, _ = dec.raw_decode(text[i:])
                      return obj
                  except Exception:
                      pass
              raise SystemExit(f'Could not parse JSON payload from {path}')

          def first_sql(path):
              obj = extract_json(path)
              rows = obj[0]['results']
              if len(rows) != 1 or not rows[0].get('sql'):
                  raise SystemExit(f'HARD STOP: missing unique SQL row in {path}')
              return rows[0]['sql']

          def normalize(s):
              s = re.sub(r'--[^\n]*', '', s)
              return re.sub(r'\s+', ' ', s).strip().rstrip(';')

          live_trigger = first_sql('/tmp/pre_trigger.txt')
          migration47 = open('migrations/0047_user_deletion_integrity.sql', encoding='utf-8').read()
          expected47 = migration47[migration47.index('CREATE TRIGGER trg_users_privacy_cleanup'):]
          if normalize(live_trigger) != normalize(expected47):
              raise SystemExit('HARD STOP: live trigger is not the reviewed pre-0049 0047 trigger')
          if 'DELETE FROM user_notifications WHERE user_id = OLD.id;' in live_trigger:
              raise SystemExit('HARD STOP: live trigger already contains 0049 behavior')

          fk = extract_json('/tmp/pre_fk.txt')
          if fk[0]['results'] != []:
              raise SystemExit(f"HARD STOP: user_notifications FK state changed: {fk[0]['results']}")

          idx = extract_json('/tmp/pre_indexes.txt')[0]['results']
          idx_names = {r['name'] for r in idx}
          required = {'idx_user_notifications_user', 'idx_user_notifications_type'}
          if not required.issubset(idx_names):
              raise SystemExit(f'HARD STOP: expected indexes absent: {required - idx_names}')

          table_sql = first_sql('/tmp/pre_table.txt')
          if 'FOREIGN KEY' in table_sql.upper() or 'REFERENCES users' in table_sql:
              raise SystemExit('HARD STOP: live user_notifications table unexpectedly gained FK semantics')
          print('PRECHECKS PASS')
          PY

      - name: Apply exactly one authorized migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo 'AUTHORIZED APPLY COMMAND:'
          echo 'npx wrangler d1 migrations apply libedge-db --env staging --remote'
          npx wrangler d1 migrations apply libedge-db --env staging --remote | tee /tmp/apply.txt

      - name: Post-apply verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          echo '=== POST PENDING MIGRATIONS ==='
          npx wrangler d1 migrations list libedge-db --env staging --remote | tee /tmp/post_pending.txt

          echo '=== POST LIVE TRIGGER ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "SELECT sql FROM sqlite_master WHERE type='trigger' AND name='trg_users_privacy_cleanup';" | tee /tmp/post_trigger.txt

          echo '=== POST user_notifications FK ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA foreign_key_list(user_notifications);" | tee /tmp/post_fk.txt

          echo '=== POST user_notifications INDEXES ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA index_list(user_notifications);" | tee /tmp/post_indexes.txt

          echo '=== POST user_notifications TABLE SQL ==='
          npx wrangler d1 execute libedge-db --env staging --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='user_notifications';" | tee /tmp/post_table.txt

          python - <<'PY'
          import json, re

          def extract_json(path):
              text = open(path, encoding='utf-8').read()
              dec = json.JSONDecoder()
              for i, ch in enumerate(text):
                  if ch not in '[{':
                      continue
                  try:
                      obj, _ = dec.raw_decode(text[i:])
                      return obj
                  except Exception:
                      pass
              raise SystemExit(f'Could not parse JSON payload from {path}')

          def first_sql(path):
              obj = extract_json(path)
              rows = obj[0]['results']
              if len(rows) != 1 or not rows[0].get('sql'):
                  raise SystemExit(f'HARD STOP: missing unique SQL row in {path}')
              return rows[0]['sql']

          def normalize(s):
              s = re.sub(r'--[^\n]*', '', s)
              return re.sub(r'\s+', ' ', s).strip().rstrip(';')

          pending_text = open('/tmp/post_pending.txt', encoding='utf-8').read()
          pending = sorted(set(re.findall(r'\b\d{4}_[A-Za-z0-9_.-]+\.sql\b', pending_text)))
          if pending:
              raise SystemExit(f'HARD STOP: migrations still pending after apply: {pending}')

          live_trigger = first_sql('/tmp/post_trigger.txt')
          migration49 = open('migrations/0049_user_notifications_deletion_policy.sql', encoding='utf-8').read()
          expected49 = migration49[migration49.index('CREATE TRIGGER trg_users_privacy_cleanup'):]
          if normalize(live_trigger) != normalize(expected49):
              raise SystemExit('HARD STOP: live trigger differs semantically from reviewed 0049 trigger')

          required_fragments = [
              'BEFORE DELETE ON users',
              'DELETE FROM user_notifications WHERE user_id = OLD.id;',
              'DELETE FROM notifications WHERE user_id = OLD.id;',
              'DELETE FROM ai_usage_logs WHERE user_id = OLD.id;',
              'UPDATE product_requests SET user_id = NULL WHERE user_id = OLD.id;',
              'privacy_r2_purge_queue',
              "entity_type = 'support_ticket'",
              "entity_type = 'user'",
              'SET before_json = NULL',
              'after_json = NULL',
          ]
          missing = [x for x in required_fragments if x not in live_trigger]
          if missing:
              raise SystemExit(f'HARD STOP: material privacy behavior missing: {missing}')

          fk = extract_json('/tmp/post_fk.txt')
          if fk[0]['results'] != []:
              raise SystemExit('HARD STOP: 0049 unexpectedly changed user_notifications FK state')

          idx = extract_json('/tmp/post_indexes.txt')[0]['results']
          idx_names = {r['name'] for r in idx}
          required_idx = {'idx_user_notifications_user', 'idx_user_notifications_type'}
          if not required_idx.issubset(idx_names):
              raise SystemExit('HARD STOP: 0049 unexpectedly changed expected indexes')

          table_sql = first_sql('/tmp/post_table.txt')
          if 'FOREIGN KEY' in table_sql.upper() or 'REFERENCES users' in table_sql:
              raise SystemExit('HARD STOP: 0049 unexpectedly rebuilt/changed user_notifications table')

          print('POSTCHECKS PASS')
          PY
