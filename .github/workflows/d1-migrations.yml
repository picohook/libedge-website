name: D1 Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target D1 environment'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      operation:
        description: 'Migration operation'
        required: true
        type: choice
        default: list
        options:
          - list
          - inspect-provisioning
          - provision-r2-pilot
          - apply

concurrency:
  group: d1-migrations-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  list-staging:
    name: List staging migrations
    if: inputs.environment == 'staging' && inputs.operation == 'list'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm version
        run: npm install -g npm@11.6.0
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: List staging migrations
        run: npx --no-install wrangler d1 migrations list libedge-db --remote --env staging

  apply-staging:
    name: Apply staging migrations
    if: inputs.environment == 'staging' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm version
        run: npm install -g npm@11.6.0
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Apply staging migrations
        run: npx --no-install wrangler d1 migrations apply libedge-db --remote --env staging

  list-production:
    name: List production migrations
    if: inputs.environment == 'production' && inputs.operation == 'list'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm version
        run: npm install -g npm@11.6.0
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: List production migrations
        run: npx --no-install wrangler d1 migrations list libedge-db-production --remote --env production

      - name: Verify post-migration Research schemas
        run: |
          npx --no-install wrangler d1 execute libedge-db-production --remote --env production --command "PRAGMA table_info(institution_subscriptions); PRAGMA table_info(institution_subscription_seats); PRAGMA table_info(research_usage_events); SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_institution_subscription_seats_subscription','idx_institution_subscription_seats_user','idx_research_usage_events_created','idx_research_usage_events_user_created','idx_research_usage_events_institution_created') ORDER BY name; SELECT slug, name FROM products WHERE slug='research';"


  inspect-production-provisioning:
    name: Inspect production Research provisioning
    if: inputs.environment == 'production' && inputs.operation == 'inspect-provisioning'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm version
        run: npm install -g npm@11.6.0
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Read-only Research provisioning evidence
        run: |
          npx --no-install wrangler d1 execute libedge-db-production --remote --env production --command "
            SELECT id, name FROM institutions WHERE id IN (1,188) ORDER BY id;
            SELECT id, institution_id, product_slug, status, start_date, end_date, seat_limit
              FROM institution_subscriptions
              WHERE institution_id IN (1,188) AND product_slug='research'
              ORDER BY institution_id, id;
            SELECT sub.institution_id, COUNT(seat.id) AS assigned_seats
              FROM institution_subscriptions sub
              LEFT JOIN institution_subscription_seats seat ON seat.institution_subscription_id=sub.id
              WHERE sub.institution_id IN (1,188) AND sub.product_slug='research'
              GROUP BY sub.institution_id
              ORDER BY sub.institution_id;
            SELECT seat.institution_subscription_id, seat.user_id,
                   sub.institution_id AS subscription_institution_id,
                   u.institution_id AS user_institution_id
              FROM institution_subscription_seats seat
              JOIN institution_subscriptions sub ON sub.id=seat.institution_subscription_id
              LEFT JOIN users u ON u.id=seat.user_id
              WHERE sub.institution_id IN (1,188) AND sub.product_slug='research'
              ORDER BY sub.institution_id, seat.user_id;
            SELECT institution_id, COUNT(*) AS institution_users
              FROM users
              WHERE institution_id IN (1,188)
              GROUP BY institution_id
              ORDER BY institution_id;
            SELECT u.institution_id, COUNT(DISTINCT s.user_id) AS active_individual_research_users
              FROM subscriptions s
              JOIN users u ON u.id=s.user_id
              WHERE u.institution_id IN (1,188)
                AND s.product_slug='research' AND s.status='active'
                AND (s.start_date IS NULL OR date(s.start_date) <= date('now'))
                AND (s.end_date IS NULL OR date(s.end_date) >= date('now'))
              GROUP BY u.institution_id
              ORDER BY u.institution_id;
          "


  provision-r2-production-pilot:
    name: Provision R2 production Research institution limits
    if: inputs.environment == 'production' && inputs.operation == 'provision-r2-pilot'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm version
        run: npm install -g npm@11.6.0
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight exact R2 institutions and existing Research subscriptions
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute libedge-db-production --remote --env production --command "
            SELECT id, name FROM institutions WHERE id IN (1,188) ORDER BY id;
            SELECT id, institution_id, product_slug, status, start_date, end_date, seat_limit
              FROM institution_subscriptions
              WHERE institution_id IN (1,188) AND product_slug='research'
              ORDER BY institution_id, id;
            SELECT sub.institution_id, COUNT(seat.id) AS assigned_seats
              FROM institution_subscriptions sub
              LEFT JOIN institution_subscription_seats seat ON seat.institution_subscription_id=sub.id
              WHERE sub.institution_id IN (1,188) AND sub.product_slug='research'
              GROUP BY sub.institution_id ORDER BY sub.institution_id;
          "

      - name: Capture production rollback bookmark
        run: npx --no-install wrangler d1 time-travel info libedge-db-production --env production

      - name: Provision R2 institution Research limits
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute libedge-db-production --remote --env production --command "
            INSERT INTO institution_subscriptions
              (institution_id, product_slug, status, access_type, start_date, seat_limit)
            SELECT 1, 'research', 'active', 'internal', CURRENT_TIMESTAMP, 10
            WHERE NOT EXISTS (
              SELECT 1 FROM institution_subscriptions
              WHERE institution_id=1 AND product_slug='research'
            );
            INSERT INTO institution_subscriptions
              (institution_id, product_slug, status, access_type, start_date, seat_limit)
            SELECT 188, 'research', 'active', 'internal', CURRENT_TIMESTAMP, 90
            WHERE NOT EXISTS (
              SELECT 1 FROM institution_subscriptions
              WHERE institution_id=188 AND product_slug='research'
            );
            UPDATE institution_subscriptions
              SET status='active', seat_limit=10
              WHERE institution_id=1 AND product_slug='research';
            UPDATE institution_subscriptions
              SET status='active', seat_limit=90
              WHERE institution_id=188 AND product_slug='research';
          "

      - name: Verify exact R2 provisioning
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute libedge-db-production --remote --env production --command "
            SELECT id, institution_id, product_slug, status, start_date, end_date, seat_limit
              FROM institution_subscriptions
              WHERE institution_id IN (1,188) AND product_slug='research'
              ORDER BY institution_id, id;
            SELECT sub.institution_id, sub.seat_limit, COUNT(seat.id) AS assigned_seats
              FROM institution_subscriptions sub
              LEFT JOIN institution_subscription_seats seat ON seat.institution_subscription_id=sub.id
              WHERE sub.institution_id IN (1,188) AND sub.product_slug='research'
              GROUP BY sub.id, sub.institution_id, sub.seat_limit
              ORDER BY sub.institution_id;
            SELECT COUNT(*) AS invalid_r2_rows
              FROM institution_subscriptions
              WHERE product_slug='research' AND institution_id IN (1,188)
                AND NOT (
                  status='active'
                  AND ((institution_id=1 AND seat_limit=10) OR (institution_id=188 AND seat_limit=90))
                );
          "


  apply-production:
    name: Apply production migrations
    if: inputs.environment == 'production' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm version
        run: npm install -g npm@11.6.0
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: List pending production migrations
        run: npx --no-install wrangler d1 migrations list libedge-db-production --remote --env production

      - name: Verify critical production schemas
        run: npx --no-install wrangler d1 execute libedge-db-production --remote --env production --command "PRAGMA table_info(products); PRAGMA table_info(users);"

      - name: Capture production rollback bookmark
        run: npx --no-install wrangler d1 time-travel info libedge-db-production --env production

      - name: Apply production migrations
        run: npx --no-install wrangler d1 migrations apply libedge-db-production --remote --env production
