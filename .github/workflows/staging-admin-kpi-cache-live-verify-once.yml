name: Staging Admin KPI Cache Live Verify Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-admin-kpi-cache-live-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live filtered KPI helper and cache headers
        run: |
          set -euo pipefail
          curl -fsSL https://staging.libedge-website.pages.dev/admin.html -o /tmp/admin.html
          grep -q 'assets/js/admin-dashboard-nav.js?v=20260907b' /tmp/admin.html
          curl -fsSL -D /tmp/nav-headers.txt 'https://staging.libedge-website.pages.dev/assets/js/admin-dashboard-nav.js?v=20260907b' -o /tmp/nav.js
          grep -qi '^cache-control: .*no-cache' /tmp/nav-headers.txt
          grep -q "filters: { requestsStatusFilter: 'pending' }" /tmp/nav.js
          grep -q "filters: { requestsTypeFilter: 'trial' }" /tmp/nav.js
          echo 'ADMIN_KPI_FILTER_CACHE_LIVE=true'
