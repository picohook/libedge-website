name: OpenAlex Secret Check Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/openalex-secret-check-once.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check OpenAlex secret binding name only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output="$(npx wrangler secret list --env staging 2>&1)"
          if printf '%s\n' "$output" | grep -q 'OPENALEX_API_KEY'; then
            echo 'OPENALEX_API_KEY_PRESENT=true'
          else
            echo 'OPENALEX_API_KEY_PRESENT=false'
          fi
