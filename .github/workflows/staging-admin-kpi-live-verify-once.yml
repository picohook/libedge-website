name: Staging Admin KPI Live Verify Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-admin-kpi-live-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live admin KPI navigation assets
        run: |
          set -euo pipefail
          curl -fsSL https://staging.libedge-website.pages.dev/admin.html -o /tmp/admin.html
          grep -q 'assets/js/admin-dashboard-nav.js?v=20260907a' /tmp/admin.html
          curl -fsSL 'https://staging.libedge-website.pages.dev/assets/js/admin-dashboard-nav.js?v=20260907a' -o /tmp/nav.js
          grep -q "statUsers.*tab: 'users'" /tmp/nav.js
          grep -q "statSubscriptions.*tab: 'subscriptions'" /tmp/nav.js
          grep -q "statInstitutions.*tab: 'institutions'" /tmp/nav.js
          grep -q "statPublishedAnnouncements.*tab: 'announcements'" /tmp/nav.js
          grep -q "statPendingRequests.*tab: 'requests'" /tmp/nav.js
          grep -q "event.key === 'Enter' || event.key === ' '" /tmp/nav.js
          echo 'ADMIN_KPI_NAV_LIVE=true'
