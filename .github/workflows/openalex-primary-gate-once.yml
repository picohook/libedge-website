name: OpenAlex Primary Gate Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/openalex-primary-gate-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run strict OpenAlex primary gate
        env:
          LIBEDGE_SMOKE_BASE_URL: 'https://staging.libedge-website.pages.dev'
          LIBEDGE_SMOKE_EMAIL: ${{ secrets.LIBEDGE_SMOKE_EMAIL }}
          LIBEDGE_SMOKE_PASSWORD: ${{ secrets.LIBEDGE_SMOKE_PASSWORD }}
          LIBEDGE_RESEARCH_REQUIRE_OPENALEX: 'true'
          LIBEDGE_RESEARCH_SMOKE_QUERY: 'iridium oxide PEM electrolyzer oxygen evolution catalyst stability'
          LIBEDGE_RESEARCH_EXPECT_TERMS: 'iridium,iro2,electrolyzer,electrolysis,oxygen evolution,oer'
        run: npm run smoke:research
