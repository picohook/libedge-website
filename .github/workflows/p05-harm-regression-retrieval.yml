name: P0.5 Harm Regression Retrieval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    name: Execute frozen A1/A2/A5/A6/A7 L/S retrieval
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      P05_RETRIEVAL_MODE: harm
      P05_QUERY_SOURCE: scripts/research-query-conditional.mjs
      P05_QUERY_IDS: A1,A2,A5,A6,A7
      P05_EXPECTED_QUERY_COUNT: '5'
      P05_OUTPUT_DIR: docs/experiments/p05-harm-regression-retrieval
      P05_PRIOR_CHARGED_CALLS: '80'
      P05_PRIOR_OBSERVED_COST_USD: '0.080'
      P05_RESERVED_FUTURE_CALLS: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate executor syntax
        run: node --check scripts/p05-hybrid-retrieval.mjs

      - name: Validate frozen harm input without provider calls
        env:
          P05_VALIDATE_ONLY: '1'
        run: node scripts/p05-hybrid-retrieval.mjs

      - name: Require OpenAlex API key
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "OPENALEX_API_KEY is not configured for the staging environment" >&2
            exit 1
          fi

      - name: Execute frozen harm retrieval
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/p05-hybrid-retrieval.mjs

      - name: Upload raw harm retrieval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-harm-regression-retrieval
          path: docs/experiments/p05-harm-regression-retrieval/
          if-no-files-found: warn
          retention-days: 30
