name: Apply 0047 Baseline Order Fix

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/0047-fix-baseline-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Apply exact baseline-order patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
          git diff -- .github/workflows/0047-controlled-staging-deletion.yml

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/0047-fix-baseline-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/0047-controlled-staging-deletion.yml .github/workflows/0047-fix-baseline-order.yml
          git commit -m "fix: take 0047 deletion baseline after login side effects"
          git push origin HEAD:staging
