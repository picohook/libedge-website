# One-shot guarded runner for migration 0047. Remove after successful execution.
name: Staging Privacy Migration Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-privacy-migration-once.yml'

concurrency:
  group: staging-privacy-migration-once
  cancel-in-progress: false

jobs:
  apply-privacy-migration:
    name: Guard and apply migration 0047
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: List pending staging migrations
        id: list
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations list libedge-db --remote --env staging

      - name: Verify only migration 0047 is pending
        id: guard
        env:
          CMD_OUTPUT: ${{ steps.list.outputs.command-output }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CMD_OUTPUT"
          pending="$(printf '%s\n' "$CMD_OUTPUT" | grep -Eo '[0-9]{4}[A-Za-z0-9_-]*\.sql' | sort -u || true)"
          other="$(printf '%s\n' "$pending" | grep -v '^0047_user_deletion_integrity\.sql$' || true)"

          if [ -n "$other" ]; then
            echo 'Unexpected pending migrations detected:' >&2
            printf '%s\n' "$other" >&2
            exit 1
          fi

          if printf '%s\n' "$pending" | grep -qx '0047_user_deletion_integrity.sql'; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Migration 0047 is not pending; treating as already applied.'
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migration 0047
        if: steps.guard.outputs.apply == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations apply libedge-db --remote --env staging

      - name: Verify staging migrations after apply
        id: verify
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations list libedge-db --remote --env staging

      - name: Assert migration 0047 is no longer pending
        env:
          CMD_OUTPUT: ${{ steps.verify.outputs.command-output }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$CMD_OUTPUT"
          if printf '%s\n' "$CMD_OUTPUT" | grep -q '0047_user_deletion_integrity.sql'; then
            echo 'Migration 0047 still appears pending after apply.' >&2
            exit 1
          fi
