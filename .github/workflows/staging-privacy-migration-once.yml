# One-shot guarded runner for migration 0047. Remove after successful execution.
name: Staging Privacy Migration Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-privacy-migration-once.yml'

concurrency:
  group: staging-privacy-migration-once
  cancel-in-progress: false

jobs:
  apply-privacy-migration:
    name: Guard and apply migration 0047
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify only migration 0047 is pending
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(npx wrangler d1 migrations list libedge-db --remote --env staging 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "Wrangler migration list failed with exit code $status" >&2
            exit "$status"
          fi

          pending="$(printf '%s\n' "$output" | grep -Eo '[0-9]{4}[A-Za-z0-9_-]*\.sql' | sort -u || true)"
          other="$(printf '%s\n' "$pending" | grep -v '^0047_user_deletion_integrity\.sql$' || true)"

          if [ -n "$other" ]; then
            echo 'Unexpected pending migrations detected:' >&2
            printf '%s\n' "$other" >&2
            exit 1
          fi

          if printf '%s\n' "$pending" | grep -qx '0047_user_deletion_integrity.sql'; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Migration 0047 is not pending; treating as already applied.'
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migration 0047
        if: steps.guard.outputs.apply == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply libedge-db --remote --env staging

      - name: Verify migration 0047 is no longer pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx wrangler d1 migrations list libedge-db --remote --env staging 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q '0047_user_deletion_integrity.sql'; then
            echo 'Migration 0047 still appears pending after apply.' >&2
            exit 1
          fi
