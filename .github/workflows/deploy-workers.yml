name: Deploy Workers

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'backend/**'
      - 'wrangler.toml'
      - 'workers/proxy/**'
      - '.github/workflows/deploy-workers.yml'

jobs:
  deploy-backend-staging:
    name: Deploy backend → libedge-api-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env staging

  deploy-backend-prod:
    name: Deploy backend → libedge-api-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env production

  deploy-proxy-staging:
    name: Deploy proxy → libedge-ra-proxy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/proxy
          command: deploy --env staging

  deploy-proxy-prod:
    name: Deploy proxy → libedge-ra-proxy-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/proxy
          command: deploy --env production
