name: Staging Admin Health Patch Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-admin-health-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Patch admin dashboard
        run: python scripts/patch-admin-health-once.py

      - name: Validate targeted diff
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "admin.html"
          git diff --numstat -- admin.html
          git diff -- admin.html

      - name: Commit targeted admin patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Remove obsolete tunnel dashboard references"
          git push origin HEAD:staging

# final cleanup pass for settings tunnel KPI
