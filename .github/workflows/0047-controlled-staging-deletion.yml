            const controlBefore = controlPureSnapshot(controlId);
            const totalsBeforeAdmin = totals();

            evidence.phases.adminPre = {
              target: adminTargetPre,
              control: controlBefore,
              totals: totalsBeforeAdmin,
            };
            save();


            // Run the real admin deletion and the predeclared unrelated write
            // probe concurrently. The probe uses existing application behavior
            // on U_TARGET_SELF, not a new write path.
            const deletePromise = request(
              `/api/admin/user/${adminId}`,
              {
                method: 'DELETE',
                jar: adminJar,
              }
            );

            const probePromise = request(
              '/api/user/profile-links',
              {
                method: 'PUT',
                jar: selfJar,
                json: {
                  links: [
                    {
                      link_type: 'website',
                      label: marker,
                      url: `https://example.invalid/${marker}/probe`,
                      display_order: 10,
