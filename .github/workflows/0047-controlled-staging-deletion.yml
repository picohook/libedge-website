            );

            const [adminDelete, probe] =
              await Promise.all([
                deletePromise,
                probePromise,
              ]);

            evidence.phases.adminHttp = {
              deletionStatus: adminDelete.status,
              deletionElapsedMs: adminDelete.elapsedMs,
              probeStatus: probe.status,
              probeElapsedMs: probe.elapsedMs,
              intervalsOverlap:
                probe.start <= adminDelete.end &&
                adminDelete.start <= probe.end,
            };
            save();

            assert(
              adminDelete.status >= 200 &&
              adminDelete.status < 300,
              `Admin deletion returned HTTP ${adminDelete.status}`
            );

            assert(
              probe.status >= 200 &&
              probe.status < 300,
              `Unrelated-write probe returned HTTP ${probe.status}`
            );

            assert(
              adminDelete.elapsedMs <= 5000,
              `Stress admin deletion exceeded 5.0s: ${adminDelete.elapsedMs}ms`
            );

            assert(
              probe.elapsedMs <= 2000,
              `Unrelated-write probe exceeded 2.0s: ${probe.elapsedMs}ms`
            );

            assert(
              evidence.phases.adminHttp.intervalsOverlap,
              'Unrelated-write probe did not overlap the admin deletion interval'
            );

            const totalsAfterAdmin = totals();
            const controlAfterAdmin =
              controlPureSnapshot(controlId);

            const adminDeltas = {
              users: -1,
              subscriptions: -adminTargetPre.subscriptions,
              newsletter_subscriptions:
                -adminTargetPre.newsletter_subscriptions,
              user_profile_links:
                -adminTargetPre.user_profile_links,
