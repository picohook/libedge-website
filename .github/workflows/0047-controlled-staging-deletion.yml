            save();

            assert(
              selfDelete.status >= 200 &&
              selfDelete.status < 300,
              `Self-service deletion returned HTTP ${selfDelete.status}`
            );

            assert(
              selfDelete.elapsedMs <= 2000,
              `Ordinary self deletion exceeded 2.0s: ${selfDelete.elapsedMs}ms`
            );

            assert(
              !selfJar.get('authToken') &&
              !selfJar.get('refreshToken'),
              'Self-service deletion did not clear session cookies'
            );

            const totalsAfterSelf = totals();
            const controlAfterSelf =
              controlPureSnapshot(controlId);

            const selfDeltas = {
              users: -1,
              subscriptions: -selfTargetPre.subscriptions,
              newsletter_subscriptions:
                -selfTargetPre.newsletter_subscriptions,
              user_profile_links:
                -selfTargetPre.user_profile_links,
              refresh_tokens:
                -selfTargetPre.refresh_tokens,
              password_resets:
                -selfTargetPre.password_resets,
              ra_user_credentials:
                -selfTargetPre.ra_user_credentials,
              announcement_reactions:
                -selfTargetPre.announcement_reactions,
              announcement_comments:
                -selfTargetPre.announcement_comments_owned,
              notifications:
                -selfTargetPre.notifications,
              user_notifications:
                -selfTargetPre.user_notifications,
              share_recipients:
                -(
                  selfTargetPre.share_recipients_direct +
                  selfTargetPre.share_recipients_owned_share
                ),
              user_collection_files:
                -selfTargetPre.user_collection_files,
              user_collections:
                -selfTargetPre.user_collections,
              file_shares:
                -selfTargetPre.file_shares,
              ticket_replies:
                -selfTargetPre.ticket_replies_owned_ticket,
              support_tickets:
                -selfTargetPre.support_tickets,
              product_requests: 0,
              ai_usage_logs:
                -selfTargetPre.ai_usage_logs,
              affiliate_clicks: 0,
              ra_link_audit_findings:
                -selfTargetPre.ra_link_audit_findings,
              form_submissions: 0,
              files: 0,
              collections: 0,
              collection_files: 0,
              institution_folders: 0,
              institution_files: 0,
              announcements: 0,
              institution_subscriptions: 0,
              admin_action_logs: 0,
              privacy_r2_purge_queue:
                selfTargetPre.queue_attachments,
            };

            assertTotalsDelta(
              totalsBeforeSelf,
              totalsAfterSelf,
              selfDeltas,
              'Self-service deletion'
            );

            assertSame(
              controlBeforeSelf,
              controlAfterSelf,
              'Pure control fixture after self deletion'
            );

            assert(
              Number(
                scalar(
                  `SELECT COUNT(*) FROM users WHERE id=${selfId}`
                )
              ) === 0,
              'Self target user row survived'
            );

            assert(
              Number(
                scalar(
                  `SELECT COUNT(*) FROM user_notifications WHERE user_id=${selfId}`
                )
              ) === 0,
              'Self target user_notifications survived'
            );

            assertAllTrue(
              retainedState('self', selfId),
              'Self retained-state assertion'
            );

            const moderatedBySelf = row(`
              SELECT deleted_by IS NULL AS ok
              FROM announcement_comments
              WHERE body='${esc(marker)}-control-moderated-by-self'
            `);

            assertAllTrue(
              moderatedBySelf,
              'Self deleted_by unlink'
            );

            const selfManagedQueue = Number(
              scalar(`
                SELECT COUNT(*)
                FROM privacy_r2_purge_queue
                WHERE object_url='ticket-attachments/${esc(marker)}/self-managed.txt'
                  AND reason='user_deletion'
              `)
            );

            const finalControlQueue = Number(
              scalar(`
                SELECT COUNT(*)
                FROM privacy_r2_purge_queue
                WHERE object_url='ticket-attachments/${esc(marker)}/control.txt'
              `)
            );

            assert(
              selfManagedQueue === 1,
              'Self managed synthetic attachment was not queued exactly once'
            );

            assert(
              finalControlQueue === 0,
              'Control attachment was unexpectedly queued'
            );

            const liveTrigger = String(
              scalar(`
                SELECT sql
                FROM sqlite_master
                WHERE type='trigger'
                  AND name='trg_users_privacy_cleanup'
              `)
            );

            assert(
              liveTrigger.includes(
                'DELETE FROM user_notifications WHERE user_id = OLD.id'
              ),
              '0049 user_notifications trigger statement disappeared during execution'
            );

            evidence.phases.selfPost = {
              totals: totalsAfterSelf,
              control: controlAfterSelf,
              queue: {
                selfManagedQueue,
                controlQueue: finalControlQueue,
              },
              live0049UserNotificationsStatement: true,
            };

            evidence.performance = {
              stressAdminDeletionMs:
                evidence.phases.adminHttp.deletionElapsedMs,
              unrelatedWriteProbeMs:
                evidence.phases.adminHttp.probeElapsedMs,
              ordinarySelfDeletionMs:
                evidence.phases.selfHttp.elapsedMs,
              limitsMs: {
                stressAdminDeletion: 5000,
                unrelatedWriteProbe: 2000,
                ordinaryDeletion: 2000,
              },
            };

            evidence.r2 = {
              consumerExecuted: false,
              realObjectCreatedByFixture: false,
              controlAttachmentQueued: false,
              note:
                'This execution proves DB purge-queue behavior only. ' +
                'No R2 consumer or object deletion is authorized here.',
            };

            evidence.classification = 'PASS';
            save();

            console.log(
              JSON.stringify(
                {
                  classification: evidence.classification,
                  stressAdminDeletionMs:
                    evidence.performance.stressAdminDeletionMs,
                  unrelatedWriteProbeMs:
                    evidence.performance.unrelatedWriteProbeMs,
                  ordinarySelfDeletionMs:
                    evidence.performance.ordinarySelfDeletionMs,
                  privacy01:
                    'admin delete audit retained with before_json/after_json NULL',
                  scope01:
                    'admin/self user_notifications PRE->POST zero; control preserved',
                  r2ConsumerExecuted: false,
                },
                null,
                2
              )
            );
          } catch (error) {
            evidence.classification = 'STOP';
            evidence.error = {
              name: error?.name || 'Error',
              message: String(
                error?.message || error
              ),
            };
            save();

            console.error(
              'CONTROLLED_EXECUTION_STOP:',
              evidence.error.message
            );

            throw error;
          }
          NODE

      - name: Copy evidence to workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$RUNNER_TEMP/0047-execution-evidence.json" ]; then
            cp \
              "$RUNNER_TEMP/0047-execution-evidence.json" \
              ./0047-execution-evidence.json
          fi

      - name: Upload controlled execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0047-controlled-staging-deletion-evidence-${{ github.run_id }}
          path: 0047-execution-evidence.json
          if-no-files-found: warn
          retention-days: 30
