          class CookieJar {
            constructor() {
              this.cookies = new Map();
            }

            header() {
              return [...this.cookies.entries()]
                .filter(([, value]) => value)
                .map(([name, value]) => `${name}=${value}`)
                .join('; ');
            }

            get(name) {
              return this.cookies.get(name) || '';
            }

            apply(res) {
              let cookies = [];

              if (typeof res.headers.getSetCookie === 'function') {
                cookies = res.headers.getSetCookie();
              } else {
                const raw = res.headers.get('set-cookie');
                if (raw) {
                  cookies = raw
                    .split(/,(?=\s*[^=;,\s]+=)/g)
                    .map((x) => x.trim());
                }
              }

              for (const cookie of cookies) {
                const match = /^([^=;\s]+)=([^;]*)/.exec(cookie);
                if (!match) continue;

                const [, name, value] = match;

                if (
                  !value ||
                  /;\s*Max-Age=0(?:;|$)/i.test(cookie)
                ) {
                  this.cookies.delete(name);
                } else {
                  this.cookies.set(name, value);
                }
              }
            }
          }

          async function request(
            path,
            {
              method = 'GET',
              json,
              jar,
            } = {}
          ) {
            const headers = new Headers();

            if (json !== undefined) {
              headers.set('content-type', 'application/json');
            }

            const cookie = jar?.header();
            if (cookie) {
              headers.set('cookie', cookie);
            }

            const url = process.env.BASE_URL + path;
            const start = performance.now();

            const res = await fetch(url, {
              method,
              headers,
              body:
                json === undefined
                  ? undefined
                  : JSON.stringify(json),
              redirect: 'manual',
            });

            jar?.apply(res);

            const text = await res.text();

            let body = null;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = null;
            }

            const end = performance.now();

            return {
              status: res.status,
              body,
              text,
              start,
              end,
              elapsedMs: end - start,
            };
          }

          async function login(email, password) {
            const jar = new CookieJar();

            const response = await request(
              '/api/auth/login',
              {
                method: 'POST',
                json: {
                  email,
                  password,
                },
                jar,
              }
            );

            assert(
              response.status === 200,
              `Login failed for ${email}: HTTP ${response.status}`
            );

            assert(
              jar.get('authToken'),
              `authToken missing for ${email}`
            );

            return jar;
          }

          const marker = process.env.RUN_MARKER;
          const adminId = getUserId(process.env.TARGET_ADMIN_EMAIL);
          const selfId = getUserId(process.env.TARGET_SELF_EMAIL);
          const controlId = getUserId(process.env.CONTROL_EMAIL);

          try {
            // Establish all login/session side effects before the PRE baseline.
            // Login writes refresh_tokens, so taking totals first would make the
            // later global-delta assertion count unrelated session creation.
            const adminJar = await login(
              process.env.STAGING_ADMIN_EMAIL,
              process.env.STAGING_ADMIN_PASSWORD
            );

            const selfJar = await login(
              process.env.TARGET_SELF_EMAIL,
              process.env.TEST_PASSWORD
            );

            const adminTargetPre = targetPre(adminId);

            assert(
              adminTargetPre.notifications === 25000,
              `Admin stress notifications expected 25000, got ${adminTargetPre.notifications}`
            );

            assert(
              adminTargetPre.ai_usage_logs === 25000,
              `Admin stress ai_usage_logs expected 25000, got ${adminTargetPre.ai_usage_logs}`
            );

            assert(
              adminTargetPre.user_notifications >= 1,
              'Admin target missing user_notifications PRE row'
