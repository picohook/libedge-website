          function assertTotalsDelta(before, after, deltas, label) {
            for (const [table, expectedDelta] of Object.entries(deltas)) {
              const actual =
                Number(after[table]) - Number(before[table]);

              assert(
                actual === expectedDelta,
                `${label}: ${table} delta expected ${expectedDelta}, got ${actual}`
              );
            }
