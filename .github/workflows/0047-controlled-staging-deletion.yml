      - name: Seed synthetic fixture
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 execute libedge-db \
            --env staging \
            --remote \
            --file "$RUNNER_TEMP/0047-fixture.sql"

          echo "FIXTURE_SEED_COMPLETE"

      # -----------------------------------------------------------------------
      # REAL ENDPOINT EXECUTION + MECHANICAL ASSERTIONS
      # -----------------------------------------------------------------------

      - name: Execute accepted one-shot deletion packet
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { performance } from 'node:perf_hooks';

          const evidencePath =
            process.env.RUNNER_TEMP + '/0047-execution-evidence.json';

          const evidence = {
            classification: 'STOP',
            runMarker: process.env.RUN_MARKER,
            githubRunId: process.env.GITHUB_RUN_ID,
            githubSha: process.env.GITHUB_SHA,
            githubRef: process.env.GITHUB_REF,
            baseUrl: process.env.BASE_URL,
            realUserDataUsed: false,
            r2ConsumerExecuted: false,
            automaticRetryExecuted: false,
            phases: {},
          };

          function save() {
            fs.writeFileSync(
              evidencePath,
              JSON.stringify(evidence, null, 2)
            );
          }

          function assert(condition, message) {
            if (!condition) {
              throw new Error(message);
            }
          }

          function esc(value) {
            return String(value).replaceAll("'", "''");
          }

          function d1(sql) {
            let stdout;

            try {
              stdout = execFileSync(
                'npx',
                [
                  'wrangler',
                  'd1',
                  'execute',
                  'libedge-db',
                  '--env',
                  'staging',
                  '--remote',
                  '--command',
                  sql,
                  '--json',
                ],
                {
                  encoding: 'utf8',
                  env: process.env,
                  stdio: ['ignore', 'pipe', 'pipe'],
                }
              );
            } catch (err) {
              throw new Error(
                'D1 command failed: ' +
                String(err?.stderr || err?.message || err)
              );
            }

            const payload = JSON.parse(stdout);
            const result = Array.isArray(payload) ? payload[0] : payload;

            if (!result?.success) {
              throw new Error(`D1 query failed: ${stdout}`);
            }

            return result.results || [];
          }

          function row(sql) {
            const rows = d1(sql);
            assert(rows.length === 1, `Expected one row: ${sql}`);
            return rows[0];
          }

          function scalar(sql) {
            const r = row(sql);
            return Object.values(r)[0];
          }

          function numericObject(input) {
            return Object.fromEntries(
              Object.entries(input).map(([k, v]) => [
                k,
                Number(v),
              ])
            );
          }

