name: 0047 Controlled Staging Deletion Precheck

on:
  push:
    branches: [staging]
    paths: ['.github/workflows/0047-deletion-precheck.yml']

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Confirm migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list libedge-db --env staging --remote
      - name: Confirm live trigger and user_notifications schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute libedge-db --env staging --remote --command "SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name='trg_users_privacy_cleanup';"
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA table_info(user_notifications);"
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA foreign_key_list(user_notifications);"
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA index_list(user_notifications);"
          npx wrangler d1 execute libedge-db --env staging --remote --command "PRAGMA index_info(idx_user_notifications_user);"
      - name: Assert 0049 trigger statement and required objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler d1 execute libedge-db --env staging --remote --json --command "SELECT sql FROM sqlite_master WHERE type='trigger' AND name='trg_users_privacy_cleanup';")
          echo "$OUT" | grep -F "DELETE FROM user_notifications WHERE user_id = OLD.id" >/dev/null
          for t in subscriptions newsletter_subscriptions user_profile_links refresh_tokens password_resets ra_user_credentials announcement_reactions announcement_comments notifications user_notifications share_recipients user_collections user_collection_files file_shares support_tickets ticket_replies ai_usage_logs ra_link_audit_findings product_requests affiliate_clicks form_submissions files collections collection_files institution_folders institution_files announcements institution_subscriptions admin_action_logs privacy_r2_purge_queue; do
            npx wrangler d1 execute libedge-db --env staging --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='$t';" | grep -F "\"$t\"" >/dev/null
          done
          echo 'PRECHECK_PASS'
