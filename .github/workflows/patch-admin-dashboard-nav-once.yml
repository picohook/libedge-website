name: Patch Admin Dashboard KPI Navigation Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/patch-admin-dashboard-nav-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 1

      - name: Insert dashboard navigation script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="assets/js/admin-health.js?v=20260907a"></script>'
          insert = marker + '\n<script src="assets/js/admin-dashboard-nav.js?v=20260907a"></script>'
          if 'assets/js/admin-dashboard-nav.js?v=20260907a' in text:
              print('already patched')
          else:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'expected exactly one admin-health marker, found {count}')
              text = text.replace(marker, insert, 1)
              path.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Validate targeted patch
        run: |
          grep -q 'assets/js/admin-health.js?v=20260907a' admin.html
          grep -q 'assets/js/admin-dashboard-nav.js?v=20260907a' admin.html
          test "$(grep -o 'assets/js/admin-dashboard-nav.js?v=20260907a' admin.html | wc -l)" -eq 1

      - name: Commit patch
        run: |
          if git diff --quiet -- admin.html; then
            echo 'No admin.html change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Wire admin dashboard KPI navigation'
          git push origin staging
