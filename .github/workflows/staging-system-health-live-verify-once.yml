name: Staging System Health Live Verify Once

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/staging-system-health-live-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live admin page with redirects
        run: |
          set -euo pipefail
          curl -fsSL -D /tmp/headers.txt https://staging.libedge-website.pages.dev/admin.html -o /tmp/admin-live.html
          grep -q 'id="systemHealthCard"' /tmp/admin-live.html
          grep -q 'assets/js/admin-health.js?v=20260907a' /tmp/admin-live.html
          ! grep -q 'statActiveTunnels' /tmp/admin-live.html
          ! grep -q 'settingsStatTunnels' /tmp/admin-live.html
          echo 'SYSTEM_HEALTH_FRONTEND_LIVE=true'
