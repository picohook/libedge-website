# ra-egress/docker-compose.yml
#
# Kurum IT'sine teslim edilen paket — kalıcı Named Tunnel kurulumu.
#
# Gereksinimler:
#   - Docker + Docker Compose (RPi 4 / Windows / Linux, 1 GB RAM yeter)
#   - Outbound 443 (HTTPS) erişimi — inbound port açılmasına gerek YOK
#   - .env dosyası (tunnel-provision.ps1 otomatik oluşturur)
#
# İLK KURULUM:
#   .\tunnel-provision.ps1           ← tek seferlik, DNS + token ayarlar
#
# SONRAKI BAŞLATMALAR (URL değişmez):
#   docker compose up -d             ← her seferinde bu kadar
#
# DURDURMA:
#   docker compose down
#
# LOGLAR:
#   docker compose logs -f cloudflared
#   docker compose logs -f ra-egress

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # TUNNEL_TOKEN → tunnel kimliğini ve credentials'ı barındırır.
    # Named tunnel: URL asla değişmez, container restart'ta otomatik bağlanır.
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - ra-egress
    # cloudflared, ra-egress'e Docker iç ağından http://ra-egress:8080 ile erişir.
    # Hiçbir inbound port açılmaz — firewall değişikliği gerekmez.

  ra-egress:
    build: .                          # Lokal build (ghcr.io image hazır olunca değiştir)
    # image: ghcr.io/libedge/ra-egress:latest
    restart: unless-stopped
    environment:
      - EGRESS_SHARED_SECRET=${EGRESS_SHARED_SECRET}
      - LIBEDGE_API_URL=${LIBEDGE_API_URL:-}
      - LIBEDGE_SERVICE_KEY=${LIBEDGE_SERVICE_KEY:-}
      - LIBEDGE_INSTITUTION_ID=${LIBEDGE_INSTITUTION_ID:-}
      - ALLOWED_HOST_REGEX=${ALLOWED_HOST_REGEX:-^(([a-z0-9-]+\.)*(jove\.com|acs\.org|annualreviews\.org|webofscience\.com|iop\.org|iopscience\.iop\.org|cas\.org|anatomy\.tv|prod\.anatomy\.tv|emis\.com|els-cdn\.com|wiley\.com|onlinelibrary\.wiley\.com|springer\.com|emerald\.com|emeraldinsight\.com|oup\.com|sciencedirect\.com|nature\.com|nejm\.org|jamanetwork\.com|aacrjournals\.org|ieee\.org|cell\.com|thelancet\.com|sagepub\.com|cambridge\.org|bmj\.com|jstor\.org|projectmuse\.org|proquest\.com|ebsco\.com|ebscohost\.com|clarivate\.com|scopus\.com|knovel\.com|rsc\.org|tandfonline\.com|degruyter\.com|brill\.com|spie\.org|optica\.org|aip\.org|aps\.org|chemrxiv\.org|asme\.org|aiaa\.org|gale\.com|cnki\.net|asha\.org|engineeringvillage\.com)|chemistry\.org|sso\.cas\.org|physicsworld\.com|njp\.org|pubs\.rsc\.org|search\.proquest\.com|search\.ebscohost\.com|link\.springer\.com|academic\.oup\.com|pubs\.acs\.org|doi\.org|dx\.doi\.org|linkinghub\.elsevier\.com|id\.elsevier\.com|www\.elsevier\.com|sciverse-shindig\.elsevier\.com|app\.knovel\.com|adisinsight\.springer\.com|elibrary\.nci\.org\.tr|opac\.tubitak\.gov\.tr|trdizin\.gov\.tr|dergipark\.org\.tr)$$}
      # AWS WAF (JoVE) ve Imperva/Incapsula (sso.cas.org) Go HTTP/2 fingerprint'ini
      # bot diye işaretliyor → bu host'lar HTTP/1.1'e zorlanır. Cloudflare-fronted
      # publisher'lar (ACS, AR, WoS, IOP, scifinder-n, vb.) HTTP/2 bekliyor; default
      # autoClient HTTP/2 önceliklidir. Buradaki regex'e match eden host'lar h1Client.
      - HTTP1_FORCE_HOSTS_REGEX=${HTTP1_FORCE_HOSTS_REGEX:-^(([a-z0-9-]+\.)*jove\.com|sso\.cas\.org)$$}
      - MAX_REQUEST_BYTES=10485760
      - LISTEN_ADDR=:8080
    # Port dışarıya açılmıyor — sadece cloudflared container'ı erişir.
    healthcheck:
      test: ["CMD", "/ra-egress", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  ra-browser:
    build: ../ra-browser
    restart: unless-stopped
    environment:
      - EGRESS_SHARED_SECRET=${EGRESS_SHARED_SECRET}
      - MAX_CONCURRENT=3
    # Internal only — not exposed externally.
    # ra-egress forwards /browser-proxy requests to this container.
    depends_on:
      - ra-egress
